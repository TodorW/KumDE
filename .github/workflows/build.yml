name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        xwayland: [disabled, enabled]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwlroots-dev libwayland-dev libxkbcommon-dev libinput-dev \
            libcairo2-dev libpam0g-dev wayland-protocols meson ninja-build \
            libxcb1-dev

      - name: Configure
        run: meson setup build -Dxwayland=${{ matrix.xwayland }}

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs
